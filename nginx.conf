# Igual que la configuración por defecto de nginx, pero escuchando también en el 3000.
server {
    listen 80;
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Inicio de sesión: se reenvía al backend de InsForge desde este mismo dominio,
    # para que la cookie que renueva la sesión sea del propio sitio. Si viniera del
    # dominio del backend, Safari en iPhone la bloquearía y la sesión se cerraría a
    # los 15 minutos. Al construir la imagen, el Dockerfile pone aquí el host de
    # VITE_INSFORGE_URL. El resolver hace que el host se busque al reenviar, así
    # nginx arranca aunque el DNS falle en ese momento.
    location /api/auth/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $insforge https://__INSFORGE_HOST__;
        proxy_pass $insforge;
        proxy_ssl_server_name on;
        proxy_ssl_name __INSFORGE_HOST__;
        proxy_set_header Host __INSFORGE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
